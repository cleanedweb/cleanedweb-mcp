[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleanedweb-mcp"
version = "1.0.1"
description = "Local stdio MCP server for CleanedWeb: forwards every request to the hosted server, so an agent can find and run maintained REST APIs that return structured records from public websites."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "CleanedWeb" }]
keywords = ["mcp", "model-context-protocol", "web data", "rest api", "structured data", "cleanedweb"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.27,<3"]

[project.urls]
Homepage = "https://cleanedweb.com/docs/mcp/"
Repository = "https://github.com/cleanedweb/cleanedweb-mcp"
Issues = "https://cleanedweb.com/contact"

[project.scripts]
cleanedweb-mcp = "cleanedweb_mcp.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/cleanedweb_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
