name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  npm:
    name: npm package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run

  mcpb:
    name: Claude Desktop bundle
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci && npm run build
        working-directory: packages/npm
      - run: npm ci && npm run build
        working-directory: packages/mcpb

  python:
    name: Python package (Python ${{ matrix.python-version }}, mcp ${{ matrix.mcp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        mcp: ["latest"]
        include:
          # "latest" installs mcp 2.x on both Pythons; this job keeps mcp 1.x covered.
          - python-version: "3.13"
            mcp: "1.x"
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]" build twine
      - if: matrix.mcp == '1.x'
        run: python -m pip install "mcp>=1.27,<2"
      - run: python -c "from importlib.metadata import version; print('mcp', version('mcp'))"
      - run: pytest -q
      - run: python -m build && twine check dist/*
